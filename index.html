<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice to Water — three maps of the world's glaciers</title>
<meta name="description" content="Where the world's glaciers are, where their area shrinks fastest, and which rivers and countries depend on their meltwater.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c5d7de'/%3E%3Cpath d='M5 21l7-11 4 6 3-4 8 9z' fill='%230b5c8e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app" data-map="1">

  <aside class="panel" aria-label="Map description">
    <header class="masthead">
      <p class="site">Ice to Water</p>
      <p class="site-sub">Three maps of the world's glaciers</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Choose a map">
      <button role="tab" id="tab-1" aria-controls="story" aria-selected="true" data-map="1"><span class="tab-n">Map 01</span><span class="tab-t">Where</span></button>
      <button role="tab" id="tab-2" aria-controls="story" aria-selected="false" data-map="2" tabindex="-1"><span class="tab-n">Map 02</span><span class="tab-t">Shrinking</span></button>
      <button role="tab" id="tab-3" aria-controls="story" aria-selected="false" data-map="3" tabindex="-1"><span class="tab-n">Map 03</span><span class="tab-t">Water</span></button>
    </div>

    <div class="story" id="story" role="tabpanel" aria-labelledby="tab-1" tabindex="0"></div>

    <footer class="colophon">
      <p>Built for a map challenge. Data: Natural Earth, RGI 7.0, GlaMBIE (2025), Huss &amp; Hock (2018), IPCC SROCC (2019), Lyu et al. (2024). Full source list in each map's notes.</p>
    </footer>
  </aside>

  <main class="stage">
    <div id="map" aria-label="Interactive map of glaciers"></div>

    <div class="map-tools" role="group" aria-label="Map view">
      <button type="button" id="btn-proj">Flat map</button>
      <button type="button" id="btn-reset">Reset view</button>
    </div>

    <details class="legend" id="legend" open></details>
    <div class="tip" id="tip" hidden></div>
    <p class="load-error" id="load-error" hidden></p>
  </main>

</div>
<script src="vendor/maplibre-gl.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
